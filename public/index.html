<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site Status</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%2322a06b'/></svg>" id="favicon" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="brand"><span class="logo-dot"></span> Site Status</div>
      <div class="top-actions">
        <span class="live" id="live"><span class="pulse"></span><span id="liveText">Connecting…</span></span>
        <button class="btn" id="checkAll" title="Run all checks now">Check all now</button>
        <button class="btn ghost" id="testMail" title="Send a test alert email">Test email</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="banner" id="banner">
      <div class="banner-title" id="bannerTitle">Loading…</div>
      <div class="banner-sub" id="bannerSub"></div>
    </section>

    <section class="tiles" id="tiles"></section>

    <section class="toolbar">
      <div class="seg" id="filters">
        <button data-f="all" class="on">All</button>
        <button data-f="wordpress">WordPress</button>
        <button data-f="nextjs">Next.js</button>
        <button data-f="other">Other</button>
        <button data-f="problems">Problems</button>
      </div>
      <input type="search" id="search" placeholder="Search sites…" />
    </section>

    <section class="list" id="list"></section>

    <section class="incidents">
      <h2>Recent events</h2>
      <ul id="incidents"></ul>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
