<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>TMJ Dashboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script>try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <!-- ============ Sidebar ============ -->
    <aside class="side" id="side">
      <a class="side-brand" href="#/">
        <span class="logo">TMJ</span>
        <span><b class="app-name">TMJ Dashboard</b><small>Office internal</small></span>
      </a>

      <nav class="nav" aria-label="Main">
        <div class="nav-label">Workspace</div>
        <a href="#/" data-nav="overview"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview</a>
        <a href="#/sites" data-nav="sites"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>Sites<span class="cnt" id="nSites"></span></a>
        <a href="#/incidents" data-nav="incidents"><svg class="i" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Incidents<span class="cnt" id="nInc" hidden></span></a>
        <a href="#/health" data-nav="health"><svg class="i" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Health &amp; SEO<span class="cnt" id="nHealth" hidden></span></a>
        <a href="#/domains" data-nav="domains"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Domains &amp; SSL<span class="cnt" id="nDom" hidden></span></a>
        <div class="nav-label">Administration</div>
        <a href="#/settings" data-nav="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings &amp; alerts</a>
        <a href="https://github.com/Apurba-Sardar/test01#readme" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Documentation</a>
      </nav>

      <div class="side-status" id="sideStatus"><b><span class="pulse"></span>Connecting…</b></div>

      <div class="side-foot">
        <div class="me">
          <span class="av" id="meAv">?</span>
          <div><b id="meName">—</b><small>Administrator</small></div>
          <button class="out" id="signout" title="Sign out" aria-label="Sign out"><svg class="i" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg></button>
        </div>
      </div>
    </aside>
    <div class="side-bg" id="sideBg"></div>

    <!-- ============ Main ============ -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
        <div class="crumbs"><h1 id="pageTitle">Overview</h1><small id="pageSub">TMJ Dashboard</small></div>
        <div class="spacer"></div>
        <div class="gsearch rel">
          <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="gsearch" type="search" placeholder="Search sites…" autocomplete="off" aria-label="Search sites" />
          <kbd>/</kbd>
          <div class="results" id="gresults" hidden></div>
        </div>
        <span class="livepill" id="live"><span class="pulse"></span><b id="liveText">Connecting</b><span class="lbl" id="nextCheck"></span></span>
        <button class="btn primary" id="checkAllTop" title="Run all checks now"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span>Check all</span></button>
        <div class="rel">
          <button class="icon-btn" id="bellBtn" aria-label="Notifications" aria-haspopup="true"><svg class="i" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dotn" id="bellCount" hidden></span></button>
          <div class="pop" id="bellPop" hidden>
            <div class="pop-h">Notifications <button class="btn ghost sm" id="notifyPerm">Desktop alerts</button></div>
            <ul class="feed pop-list" id="bellList"></ul>
            <a class="pop-f" href="#/incidents" id="bellAll">View all incidents</a>
          </div>
        </div>
        <button class="icon-btn" id="themeBtn" aria-label="Switch theme" title="Switch theme"></button>
      </header>

      <main class="view" id="view"></main>

      <footer class="foot">
        <span>© <span id="year"></span> <b class="app-name">TMJ Dashboard</b><span class="sep">·</span>Office internal use only</span>
        <span id="footInfo"></span>
      </footer>
    </div>
  </div>

  <div class="tip" id="tip" role="tooltip"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
